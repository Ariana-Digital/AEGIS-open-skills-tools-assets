<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">AI supply-chain exposure map worksheet</title>
  <desc id="desc">A blank worksheet for mapping a business process across eight dependencies and recording owner, evidence, failure consequence, recovery and exit.</desc>
  <rect width="1080" height="1350" fill="#0D0F12"/>
  <rect x="0" y="0" width="18" height="1350" fill="#07A3D1"/>
  <text x="72" y="78" fill="#FF7900" font-family="Roboto, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2">AI HAS A SUPPLY CHAIN  •  DECISION TOOL</text>
  <text x="72" y="158" fill="#EDE8E3" font-family="Radley, Georgia, serif" font-size="61">Map one workflow backwards.</text>
  <text x="72" y="210" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="26">Start with the consequence. Then test every dependency beneath it.</text>

  <rect x="72" y="258" width="936" height="126" rx="18" fill="#15191E" stroke="#38414A" stroke-width="2"/>
  <text x="100" y="302" fill="#07A3D1" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700">BUSINESS PROCESS</text>
  <line x1="100" y1="345" x2="490" y2="345" stroke="#87919A" stroke-width="2"/>
  <text x="540" y="302" fill="#07A3D1" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700">FAILURE CONSEQUENCE</text>
  <line x1="540" y1="345" x2="980" y2="345" stroke="#87919A" stroke-width="2"/>

  <g font-family="Roboto, Arial, sans-serif">
    <rect x="72" y="422" width="936" height="70" rx="12" fill="#252B31"/>
    <text x="86" y="465" fill="#EDE8E3" font-size="19" font-weight="700">DEPENDENCY</text>
    <text x="264" y="465" fill="#EDE8E3" font-size="19" font-weight="700">OWNER</text>
    <text x="420" y="465" fill="#EDE8E3" font-size="19" font-weight="700">EVIDENCE</text>
    <text x="587" y="465" fill="#EDE8E3" font-size="19" font-weight="700">IF IT FAILS</text>
    <text x="760" y="465" fill="#EDE8E3" font-size="19" font-weight="700">RECOVERY</text>
    <text x="915" y="465" text-anchor="middle" fill="#EDE8E3" font-size="19" font-weight="700">EXIT</text>

    <g fill="#15191E" stroke="#38414A" stroke-width="2">
      <rect x="72" y="506" width="936" height="83"/>
      <rect x="72" y="589" width="936" height="83"/>
      <rect x="72" y="672" width="936" height="83"/>
      <rect x="72" y="755" width="936" height="83"/>
      <rect x="72" y="838" width="936" height="83"/>
      <rect x="72" y="921" width="936" height="83"/>
      <rect x="72" y="1004" width="936" height="83"/>
      <rect x="72" y="1087" width="936" height="83"/>
    </g>
    <g stroke="#38414A" stroke-width="2">
      <line x1="246" y1="422" x2="246" y2="1170"/><line x1="400" y1="422" x2="400" y2="1170"/><line x1="566" y1="422" x2="566" y2="1170"/><line x1="740" y1="422" x2="740" y2="1170"/><line x1="884" y1="422" x2="884" y2="1170"/>
    </g>
    <g fill="#EDE8E3" font-size="22" font-weight="700">
      <text x="90" y="557">Model</text><text x="90" y="640">Identity</text><text x="90" y="723">Data</text><text x="90" y="806">Cloud region</text><text x="90" y="889">Compute</text><text x="90" y="972">Network</text><text x="90" y="1055">Power</text><text x="90" y="1138">Operations</text>
    </g>
    <g stroke="#65717D" stroke-width="1.5">
      <line x1="264" y1="559" x2="382" y2="559"/><line x1="420" y1="559" x2="548" y2="559"/><line x1="587" y1="559" x2="722" y2="559"/><line x1="760" y1="559" x2="866" y2="559"/><line x1="902" y1="559" x2="990" y2="559"/>
      <line x1="264" y1="642" x2="382" y2="642"/><line x1="420" y1="642" x2="548" y2="642"/><line x1="587" y1="642" x2="722" y2="642"/><line x1="760" y1="642" x2="866" y2="642"/><line x1="902" y1="642" x2="990" y2="642"/>
