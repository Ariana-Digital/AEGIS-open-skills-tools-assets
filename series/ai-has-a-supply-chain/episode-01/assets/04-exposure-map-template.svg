      <line x1="264" y1="808" x2="382" y2="808"/><line x1="420" y1="808" x2="548" y2="808"/><line x1="587" y1="808" x2="722" y2="808"/><line x1="760" y1="808" x2="866" y2="808"/><line x1="902" y1="808" x2="990" y2="808"/>
      <line x1="264" y1="891" x2="382" y2="891"/><line x1="420" y1="891" x2="548" y2="891"/><line x1="587" y1="891" x2="722" y2="891"/><line x1="760" y1="891" x2="866" y2="891"/><line x1="902" y1="891" x2="990" y2="891"/>
      <line x1="264" y1="974" x2="382" y2="974"/><line x1="420" y1="974" x2="548" y2="974"/><line x1="587" y1="974" x2="722" y2="974"/><line x1="760" y1="974" x2="866" y2="974"/><line x1="902" y1="974" x2="990" y2="974"/>
      <line x1="264" y1="1057" x2="382" y2="1057"/><line x1="420" y1="1057" x2="548" y2="1057"/><line x1="587" y1="1057" x2="722" y2="1057"/><line x1="760" y1="1057" x2="866" y2="1057"/><line x1="902" y1="1057" x2="990" y2="1057"/>
      <line x1="264" y1="1140" x2="382" y2="1140"/><line x1="420" y1="1140" x2="548" y2="1140"/><line x1="587" y1="1140" x2="722" y2="1140"/><line x1="760" y1="1140" x2="866" y2="1140"/><line x1="902" y1="1140" x2="990" y2="1140"/>
    </g>
  </g>

  <rect x="72" y="1210" width="936" height="82" rx="16" fill="#25160F" stroke="#FF4F00" stroke-width="2"/>
  <text x="104" y="1260" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="700">Decision test: Which blank prevents approval today?</text>
  <text x="72" y="1325" fill="#87919A" font-family="Roboto, Arial, sans-serif" font-size="17">Use with finance, technology, operations and risk. Confirm the entries against live architecture and contract evidence.</text>
</svg>
