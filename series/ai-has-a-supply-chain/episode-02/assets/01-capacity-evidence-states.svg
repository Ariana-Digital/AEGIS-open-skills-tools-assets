<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Six capacity evidence states</title>
  <desc id="desc">Six distinct capacity states from announcement through workload acceptance, plus parallel finance, permit, power and construction tracks showing that the unresolved gate controls the date.</desc>

  <rect width="1080" height="1350" fill="#0D0F12"/>
  <rect x="0" y="0" width="18" height="1350" fill="#FF4F00"/>
  <text x="72" y="68" fill="#07A3D1" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">AI HAS A SUPPLY CHAIN  •  02/12</text>
  <text x="72" y="174" font-size="56" fill="#EDE8E3" font-family="Radley, Georgia, serif"><tspan x="72" y="174">Six states.</tspan><tspan x="72" y="236">One date.</tspan></text>
  <text x="72" y="284" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="25">The unresolved gate controls when the workload can run.</text>

    <rect x="72" y="330" width="420" height="138" rx="20" fill="#15191E" stroke="#38414A" stroke-width="2"/>
    <circle cx="120" cy="378" r="25" fill="#FF4F00"/>
    <text x="120" y="387" text-anchor="middle" fill="#0D0F12" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700">01</text>
    <text x="160" y="378" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700">ANNOUNCED</text>
    <text x="160" y="418" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20">Plan, target, tender or scope</text>
    <rect x="540" y="330" width="420" height="138" rx="20" fill="#15191E" stroke="#38414A" stroke-width="2"/>
    <circle cx="588" cy="378" r="25" fill="#FF4F00"/>
    <text x="588" y="387" text-anchor="middle" fill="#0D0F12" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700">02</text>
    <text x="628" y="378" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700">COMMERCIALLY BACKED</text>
    <text x="628" y="418" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20">Funding and contract structure</text>
    <rect x="72" y="498" width="420" height="138" rx="20" fill="#15191E" stroke="#38414A" stroke-width="2"/>
    <circle cx="120" cy="546" r="25" fill="#FF4F00"/>
    <text x="120" y="555" text-anchor="middle" fill="#0D0F12" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700">03</text>
    <text x="160" y="546" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700">PERMITTED</text>
    <text x="160" y="586" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20">Approvals for the stated phase</text>
    <rect x="540" y="498" width="420" height="138" rx="20" fill="#15191E" stroke="#38414A" stroke-width="2"/>
    <circle cx="588" cy="546" r="25" fill="#FF4F00"/>
    <text x="588" y="555" text-anchor="middle" fill="#0D0F12" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700">04</text>
    <text x="628" y="546" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700">POWER-SECURED</text>
    <text x="628" y="586" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20">Supply, interconnection and ramp</text>
    <rect x="72" y="666" width="420" height="138" rx="20" fill="#15191E" stroke="#38414A" stroke-width="2"/>
    <circle cx="120" cy="714" r="25" fill="#FF4F00"/>
    <text x="120" y="723" text-anchor="middle" fill="#0D0F12" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700">05</text>
    <text x="160" y="714" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700">BUILT + ENERGIZED</text>
    <text x="160" y="754" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20">Relevant systems installed and powered</text>
    <rect x="540" y="666" width="420" height="138" rx="20" fill="#10262A" stroke="#07A3D1" stroke-width="2"/>
    <circle cx="588" cy="714" r="25" fill="#07A3D1"/>
    <text x="588" y="723" text-anchor="middle" fill="#0D0F12" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700">06</text>
    <text x="628" y="714" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="23" font-weight="700">WORKLOAD-ACCEPTED</text>
    <text x="628" y="754" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="17">Test passed and customer access reserved</text>

  <text x="72" y="880" fill="#EDE8E3" font-family="Radley, Georgia, serif" font-size="39">The middle gates can move in parallel.</text>

    <text x="72" y="962" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700">FINANCE</text>
    <line x1="210" y1="954" x2="950" y2="954" stroke="#38414A" stroke-width="12" stroke-linecap="round"/>
    <line x1="210" y1="954" x2="1000" y2="954" stroke="#07A3D1" stroke-width="12" stroke-linecap="round"/>

    <text x="72" y="1030" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700">PERMITS</text>
    <line x1="210" y1="1022" x2="950" y2="1022" stroke="#38414A" stroke-width="12" stroke-linecap="round"/>
    <line x1="210" y1="1022" x2="850" y2="1022" stroke="#FF7900" stroke-width="12" stroke-linecap="round"/>

    <text x="72" y="1098" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700">POWER</text>
    <line x1="210" y1="1090" x2="950" y2="1090" stroke="#38414A" stroke-width="12" stroke-linecap="round"/>
    <line x1="210" y1="1090" x2="630" y2="1090" stroke="#FF4F00" stroke-width="12" stroke-linecap="round"/>
    <rect x="620" y="1070" width="126" height="40" rx="20" fill="#2A1711" stroke="#FF4F00" stroke-width="2"/><text x="683" y="1097" text-anchor="middle" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700">BLOCKED</text>
    <text x="72" y="1166" fill="#B9C1C8" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700">BUILD</text>
    <line x1="210" y1="1158" x2="950" y2="1158" stroke="#38414A" stroke-width="12" stroke-linecap="round"/>
    <line x1="210" y1="1158" x2="920" y2="1158" stroke="#07A3D1" stroke-width="12" stroke-linecap="round"/>

  <rect x="72" y="1225" width="936" height="73" rx="18" fill="#25160F" stroke="#FF4F00" stroke-width="2"/>
  <text x="104" y="1271" fill="#EDE8E3" font-family="Roboto, Arial, sans-serif" font-size="24" font-weight="700">Board test: which open gate can still move the service date?</text>
  <text x="72" y="1330" fill="#87919A" font-family="Roboto, Arial, sans-serif" font-size="17">Editorial model. Evidence states may overlap; workload acceptance requires a customer-specific commitment.</text>
</svg>